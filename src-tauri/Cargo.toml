[package]
name = "cistory-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace]
members = [".", "crates/domain", "crates/storage", "crates/clipboard", "crates/hotkey"]
resolver = "2"

[lib]
name = "cistory_desktop"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0.98"
arboard = { version = "3.6.1", default-features = true }
chrono = { version = "0.4.41", features = ["serde"] }
clipboard = { path = "crates/clipboard" }
domain = { path = "crates/domain" }
hotkey = { path = "crates/hotkey" }
parking_lot = "0.12.3"
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
storage = { path = "crates/storage" }
tauri = { version = "2.5.1", features = ["tray-icon", "image-ico", "protocol-asset"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
global-hotkey = "0.8.0"
png = "0.18.0"
